# beauty_personal_care.yaml — domain config for Beauty & Personal Care
# This is the FIRST DEEP DOMAIN. All ML models are trained here first.
#
# Every term has a `source` field:
#   human         = reviewed and approved by the project owner
#   agent_proposed = proposed by the AI; awaiting human review
#
# ⚠️ STATUS: agent_proposed — awaiting user review

domain: beauty_personal_care
language: en
micro_domains: [skincare, makeup, haircare, nail_art, fragrance, personal_hygiene]

# ── DOMAIN KEYWORDS (used as weak-label features in Phase 3) ──────────────────
# DO NOT add creator names, brand sentiment words, or moral judgements here.
keywords:
  core:
    - {term: "skincare", source: agent_proposed}
    - {term: "makeup", source: agent_proposed}
    - {term: "foundation", source: agent_proposed}
    - {term: "concealer", source: agent_proposed}
    - {term: "moisturizer", source: agent_proposed}
    - {term: "serum", source: agent_proposed}
    - {term: "sunscreen", source: agent_proposed}
    - {term: "spf", source: agent_proposed}
    - {term: "retinol", source: agent_proposed}
    - {term: "hyaluronic acid", source: agent_proposed}
    - {term: "blush", source: agent_proposed}
    - {term: "highlighter", source: agent_proposed}
    - {term: "contour", source: agent_proposed}
    - {term: "mascara", source: agent_proposed}
    - {term: "eyeliner", source: agent_proposed}
    - {term: "eyeshadow", source: agent_proposed}
    - {term: "lipstick", source: agent_proposed}
    - {term: "lip gloss", source: agent_proposed}
    - {term: "primer", source: agent_proposed}
    - {term: "setting spray", source: agent_proposed}
    - {term: "haircare", source: agent_proposed}
    - {term: "shampoo", source: agent_proposed}
    - {term: "conditioner", source: agent_proposed}
    - {term: "hair mask", source: agent_proposed}
    - {term: "hair oil", source: agent_proposed}
    - {term: "nail polish", source: agent_proposed}
    - {term: "manicure", source: agent_proposed}
    - {term: "gel nails", source: agent_proposed}
    - {term: "perfume", source: agent_proposed}
    - {term: "fragrance", source: agent_proposed}
    - {term: "deodorant", source: agent_proposed}
    - {term: "body lotion", source: agent_proposed}
    - {term: "cleanser", source: agent_proposed}
    - {term: "toner", source: agent_proposed}
    - {term: "exfoliant", source: agent_proposed}
    - {term: "acne", source: agent_proposed}
