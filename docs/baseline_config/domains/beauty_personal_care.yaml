# ── SPONSORSHIP DETECTION PATTERNS ────────────────────────────────────────────
# Used in Phase 4 rule-based sponsor detection.
# Patterns are applied to video title + description (lowercased).
sponsor_disclosure_patterns:
  - {pattern: "#ad", source: agent_proposed}
  - {pattern: "#sponsored", source: agent_proposed}
  - {pattern: "#gifted", source: agent_proposed}
  - {pattern: "paid partnership", source: agent_proposed}
  - {pattern: "this video is sponsored by", source: agent_proposed}
  - {pattern: "sponsored by", source: agent_proposed}
  - {pattern: "in partnership with", source: agent_proposed}
  - {pattern: "thank you.*for sending", source: agent_proposed}
  - {pattern: "use code.*for.*off", source: agent_proposed}  # promo codes
  - {pattern: "discount code", source: agent_proposed}
  - {pattern: "affiliate link", source: agent_proposed}
  - {pattern: "\\*links below\\*", source: agent_proposed}
  - {pattern: "pr package", source: agent_proposed}
  - {pattern: "press sample", source: agent_proposed}
  - {pattern: "collab with", source: agent_proposed}

affiliate_link_patterns:
  - {pattern: "ltk\\.com", source: agent_proposed}     # LikeToKnowIt / LTK
  - {pattern: "shopmy\\.us", source: agent_proposed}   # ShopMy
  - {pattern: "shareasale\\.com", source: agent_proposed}
  - {pattern: "bit\\.ly", source: agent_proposed}      # generic shortlinks (low precision)
  - {pattern: "utm_source=", source: agent_proposed}   # UTM params
  - {pattern: "utm_campaign=", source: agent_proposed}

# ── PURCHASE INTENT PHRASES (Phase 6 rules baseline) ─────────────────────────
purchase_intent_phrases:
  strong_positive:
    - {phrase: "where can i buy", source: agent_proposed}
    - {phrase: "where to buy", source: agent_proposed}
    - {phrase: "link?", source: agent_proposed}
    - {phrase: "where do i get", source: agent_proposed}
    - {phrase: "just ordered", source: agent_proposed}
    - {phrase: "already bought", source: agent_proposed}
    - {phrase: "used your code", source: agent_proposed}
    - {phrase: "used your link", source: agent_proposed}
    - {phrase: "bought this", source: agent_proposed}
    - {phrase: "adding to cart", source: agent_proposed}
    - {phrase: "going to try this", source: agent_proposed}
    - {phrase: "need this in my life", source: agent_proposed}
    - {phrase: "is it available in", source: agent_proposed}
  weak_positive:
    - {phrase: "how much does it cost", source: agent_proposed}
    - {phrase: "how much is it", source: agent_proposed}
    - {phrase: "worth buying", source: agent_proposed}
    - {phrase: "should i get", source: agent_proposed}
    - {phrase: "want to try", source: agent_proposed}
  negative:
    - {phrase: "not worth it", source: agent_proposed}
    - {phrase: "wouldn't buy", source: agent_proposed}
    - {phrase: "waste of money", source: agent_proposed}
