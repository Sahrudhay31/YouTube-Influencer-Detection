# sponsorship.yaml — rules and patterns for sponsorship detection
# All terms are source: agent_proposed until reviewed by human owner.

disclosure_phrases:
  - {pattern: "#ad", source: agent_proposed}
  - {pattern: "#sponsored", source: agent_proposed}
  - {pattern: "#gifted", source: agent_proposed}
  - {pattern: "paid partnership", source: agent_proposed}
  - {pattern: "sponsored by", source: agent_proposed}
  - {pattern: "in partnership with", source: agent_proposed}
  - {pattern: "thanks to .* for sponsoring", source: agent_proposed}
  - {pattern: "thank you .* for partnering", source: agent_proposed}
  - {pattern: "paid promotion", source: agent_proposed}
  - {pattern: "pr package", source: agent_proposed}
  - {pattern: "press sample", source: agent_proposed}

